# Builds every form and runs its tests against the CURRENTLY PUBLISHED BIZUIT packages.
#
# 🔴 WHY THIS EXISTS. Until 2026-09-29 the only workflow here packaged the forms — it never
# type-checked them and it never ran a test, because there were no tests to run. So a new version
# of @tyconsa/bizuit-ui-components or of @tyconsa/bizuit-form-sdk could break the template without
# a single commit in this repository, and nobody would find out until someone started a new form
# from it, weeks later.
#
# A template that is not built is not a template: it is a snapshot of a day that has passed.
#
# The nightly run is the point of the whole file. The packages move on their own, so "it worked
# when we last touched it" is not the same as "it works today".

name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every day at 06:00 UTC — catches a package that broke the template with no commit here.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build-and-test:
    name: Type-check, test and build every form
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # 🔴 Node 18 reached end of life in April 2025. Keep this in step with the version in
          # build-deployment-package.yml: a template that is tested on one version and packaged on
          # another is testing something the users never run.
          node-version: '20'
          cache: 'npm'

      - name: Install the shared build dependencies
        # Root install: esbuild and the scripts under scripts/. Each form installs its own
        # dependencies on demand (see scripts/run-in-forms.js).
        run: npm install

      - name: Move the BIZUIT packages to their newest published version
        # 🔴 ONLY on the scheduled and manual runs, and ON PURPOSE.
        #
        # On a pull request we want to know whether THIS change works, against the dependency set
        # the lockfiles pin. At night we want the opposite question: does the template still work
        # with the packages as they are published TODAY? `npm install` alone would not answer it —
        # it honours the lockfile whenever the lockfile still satisfies the ranges, so the nightly
        # would keep proving that an old, frozen combination works.
        #
        # Nothing is committed: the refresh lives and dies inside the runner.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          for form in */; do
            [ -f "${form}package.json" ] || continue
            echo "::group::${form%/}: refreshing the BIZUIT packages"
            (
              cd "$form"
              npm install
              npm update @tyconsa/bizuit-form-sdk @tyconsa/bizuit-ui-components
              echo "Resolved versions:"
              npm ls @tyconsa/bizuit-form-sdk @tyconsa/bizuit-ui-components || true
            )
            echo "::endgroup::"
          done

      - name: Type-check
        # esbuild STRIPS the types without checking them, so a form with a real type error builds,
        # ships and fails in the browser. This is the only step that reads the types.
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        # Build comes after the tests, so a build failure is never mistaken for a test failure.
        run: npm run build

      # 🔴 DEPENDENCY SCAN (2026-11-19). A new product created from this template had its first pull
      # request stopped by high vulnerabilities inherited from here (an old @tyconsa/bizuit-form-sdk
      # in the root package.json brought vulnerable axios, form-data and zod). This workflow never
      # scanned dependencies, so nobody saw them.
      #
      # It uses the same harness script as a product pipeline, on the root and on every form, as
      # the product does. One difference, on purpose: in a product pipeline "could not measure"
      # (exit 2) only warns, because the nightly review looks again. Here nothing looks again, so it
      # fails. The scan runs after the build and even if an earlier step failed, so one red run
      # reports every problem.
      - name: Fetch the harness (public, no credentials)
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --single-branch --branch main --no-tags \
            https://github.com/TYCON-SA/tycon-harness.git "$RUNNER_TEMP/tcg"
          echo "Harness at $(git -C "$RUNNER_TEMP/tcg" rev-parse --short HEAD)"

      - name: Dependency scan (root and every form, same criterion as the product pipeline)
        if: ${{ !cancelled() }}
        run: |
          set -u
          AUD="$RUNNER_TEMP/tcg/scripts/ci/audit-dependencies.js"
          [ -f "$AUD" ] || { echo "::error::audit-dependencies.js did not arrive from the harness — a missing gate is not a passed gate"; exit 1; }
          FORMS=$(find . -maxdepth 2 -type f -name package.json -not -path '*/node_modules/*' | grep -v '^\./package.json' | xargs -n1 dirname | sort -u)
          [ -n "$FORMS" ] || { echo "::error::No form found — 'saw nothing' is not 'clean'"; exit 1; }
          VULNERABLE=""; UNMEASURED=""
          for dir in . $FORMS; do
            echo "── $dir"
            # `|| RC=$?`: GitHub runs steps with `bash -e`, which would stop the loop at the first
            # finding and leave the remaining forms unscanned.
            RC=0; node "$AUD" --repo "$dir" --type npm --block || RC=$?
            case "$RC" in
              0) ;;
              1) VULNERABLE="$VULNERABLE $dir" ;;
              *) UNMEASURED="$UNMEASURED $dir" ;;
            esac
          done
          [ -z "$UNMEASURED" ] || echo "::error::The scan could not measure:$UNMEASURED — not measured is not clean"
          [ -z "$VULNERABLE" ] || echo "::error::High or critical vulnerable packages in:$VULNERABLE — every new product would inherit them"
          [ -z "$UNMEASURED$VULNERABLE" ]
